name: HarmoGestion_test
services:
    mysql:
        image: mysql:9.7.0
        volumes:
            -   mysql_data:/var/lib/mysql
            -   ./DossierConception/SQL/script_creation_bdd_and_data.sql:/docker-entrypoint-initdb.d/init.sql:ro
        restart: unless-stopped
        environment:
            MYSQL_USER: harmoGestion
            MYSQL_PASSWORD: ${BDD_USER_PWD}
            MYSQL_ROOT_PASSWORD: ${BDD_ROOT_PWD}
            MYSQL_DATABASE: harmogestion

    api:
        image: cedricdidier/harmogestion_api:latest
        pull_policy: always
        depends_on:
            -   mysql
        restart: unless-stopped
        ports:
            -   "8085:8080"
        environment:
            HARMOGESTION_DB_URL: jdbc:mysql://mysql:3306/harmogestion
            HARMOGESTION_DB_USERNAME: harmoGestion
            HARMOGESTION_DB_PASSWORD: ${BDD_USER_PWD}
            HARMOGESTION_DB_DRIVER: com.mysql.cj.jdbc.Driver
            HARMOGESTION_DB_DIALECT: org.hibernate.dialect.MySQLDialect
    phpmyadmin:
        depends_on:
            - mysql
        image: phpmyadmin:5.2.3
        ports:
            - "8090:80"
        restart: unless-stopped
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: ${BDD_ROOT_PWD}
    web:
        image: cedricdidier/harmogestion_web:latest
        pull_policy: always
        depends_on:
            -   api
        restart: unless-stopped
        ports:
            -   "8080:8080"
        environment:
            HARMOGESTION_API_URL: http://api:8080
volumes:
    mysql_data: